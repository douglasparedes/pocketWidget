plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

def signingPropsFile = rootProject.file('keystore.properties')
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'com.pocketwidget'
    compileSdk 37

    defaultConfig {
        applicationId 'com.pocketwidget'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (signingPropsFile.exists()) {
            release {
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (signingPropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
    arg('room.generateKotlin', 'true')
}

// Offline-build pins: these are the versions present in the local artifact cache.
// Remove them on a normal online build (see README).
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.compose.material' && details.requested.name == 'material-icons-core') {
            details.useVersion '1.0.0'
        }
    }
    resolutionStrategy.force 'androidx.window:window:1.5.1'
    resolutionStrategy.force 'androidx.window:window-core:1.5.1'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'

    implementation 'androidx.compose.ui:ui:1.10.5'
    implementation 'androidx.compose.foundation:foundation:1.10.5'
    implementation 'androidx.compose.material3:material3:1.3.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'
    ksp 'androidx.room:room-compiler:2.7.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
